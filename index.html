<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency SOS System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚨 Emergency SOS</h1>
        <p>Cloud-Based Emergency Alert System</p>
    </header>

    <main>

        <section class="card">
            <h2>Emergency SOS</h2>

            <p id="statusMessage">
                Press the button in an emergency.
            </p>

            <button id="sosButton">
                🚨 SEND SOS
            </button>

            <p id="locationStatus">
                Location: Not detected
            </p>
        </section>

        <section class="card">
            <h2>System Information</h2>

            <p>☁️ Cloud: Firebase</p>
            <p>📍 GPS: Browser Geolocation</p>
            <p>🗄️ Database: Firestore</p>
        </section>

    </main>

    <footer>
        <p>Emergency SOS System © 2026</p>
    </footer>

    <script type="module" src="script.js"></script>

</body>
</html>
